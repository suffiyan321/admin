<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - TechCore</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; min-height: 100vh; }

    .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar h2 { color: #fff; font-size: 1.3rem; font-weight: 700; margin-bottom: 30px; }
    .nav-links { list-style: none; }
    .nav-links li { margin-bottom: 8px; }
    .nav-links a { color: #8b949e; text-decoration: none; padding: 12px 16px; border-radius: 8px; display: block; font-weight: 500; transition: all 0.2s; }
    .nav-links a:hover, .nav-links a.active { background: #1f6beb; color: #fff; font-weight: 600; }

    .btn-logout { background: #21262d; color: #f85149; border: 1px solid #30363d; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; text-align: left; margin-top: auto; }
    .btn-logout:hover { background: #b62324; color: #fff; }

    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .topbar h2 { color: #fff; font-size: 1.6rem; font-weight: 700; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; padding: 22px; border-radius: 12px; }
    .stat-card h4 { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px; }
    .stat-card h2 { color: #fff; font-size: 1.8rem; font-weight: 700; }

    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-header h3 { color: #fff; font-size: 1.2rem; }
    .card-header a { color: #58a6ff; text-decoration: none; font-size: 0.9rem; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { border-bottom: 1px solid #30363d; color: #8b949e; padding: 12px 15px; font-size: 0.85rem; text-transform: uppercase; }
    td { padding: 14px 15px; border-bottom: 1px solid #21262d; color: #c9d1d9; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <h2>Admin Panel</h2>
      <ul class="nav-links">
        <li><a href="index.html" class="active">📊 Dashboard</a></li>
        <li><a href="products.html">📦 Products</a></li>
        <li><a href="categories.html">🏷️ Categories</a></li>
        <li><a href="orders.html">🛒 Orders Tracker</a></li>
      </ul>
    </div>
    <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h2>Dashboard Overview</h2>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h4>Total Revenue</h4>
        <h2 id="totalRevenue">$0.00</h2>
      </div>
      <div class="stat-card">
        <h4>Total Orders</h4>
        <h2 id="totalOrders">0</h2>
      </div>
      <div class="stat-card">
        <h4>Pending Orders</h4>
        <h2 id="pendingOrders">0</h2>
      </div>
      <div class="stat-card">
        <h4>Active Products</h4>
        <h2 id="activeProducts">0</h2>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Recent Orders</h3>
        <a href="orders.html">View All Orders &rarr;</a>
      </div>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Product / Items</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recentOrdersBody">
          <tr>
            <td colspan="5" style="text-align:center; padding:20px; color:#8b949e;">Loading data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      loadDashboardData();
    });

    function logoutAdmin() {
      localStorage.removeItem('adminLoggedIn');
      localStorage.removeItem('userRole');
      localStorage.removeItem('sb-token');

      const loginURL = 'https://tech-core-shop.netlify.app/login.html';

      if (typeof db !== 'undefined' && db.auth) {
        db.auth.signOut().then(() => {
          window.location.href = loginURL;
        });
      } else {
        window.location.href = loginURL;
      }
    }

    function loadDashboardData() {
      if (typeof db === 'undefined') return;

      db.from('products').select('id', { count: 'exact' }).then(res => {
        if (!res.error) {
          document.getElementById('activeProducts').innerText = res.count || (res.data ? res.data.length : 0);
        }
      });

      db.from('orders').select('*').order('id', { ascending: false }).then(res => {
        if (res.error) {
          document.getElementById('recentOrdersBody').innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f85149;">Error loading orders</td></tr>`;
          return;
        }

        const orders = res.data || [];
        document.getElementById('totalOrders').innerText = orders.length;

        let revenue = 0;
        let pendingCount = 0;

        orders.forEach(o => {
          const amt = parseFloat(o.total || o.total_amount || o.price || o.amount || 0);
          revenue += amt;
          if ((o.status || 'Pending').toLowerCase() === 'pending') {
            pendingCount++;
          }
        });

        document.getElementById('totalRevenue').innerText = '$' + revenue.toFixed(2);
        document.getElementById('pendingOrders').innerText = pendingCount;

        const recent = orders.slice(0, 5);
        const tbody = document.getElementById('recentOrdersBody');
        tbody.innerHTML = '';

        if (recent.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">No recent orders.</td></tr>';
          return;
        }

        recent.forEach(o => {
          const name = o.customer_name || o.name || o.full_name || 'Guest User';
          const amt = parseFloat(o.total || o.total_amount || o.price || o.amount || 0).toFixed(2);
          
          let itemsStr = 'Items';
          let raw = o.items || o.cart || o.products;
          if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch(e){} }
          if (Array.isArray(raw)) {
            itemsStr = raw.map(i => (typeof i === 'string' ? i : (i.title || i.name || 'Item'))).join(', ');
          } else if (raw) itemsStr = String(raw);

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>#${o.id}</b></td>
            <td>${name}</td>
            <td style="max-width:200px; word-break:break-word;">${itemsStr}</td>
            <td><b style="color:#58a6ff;">$${amt}</b></td>
            <td><span style="color:${(o.status||'').toLowerCase()==='delivered'?'#3fb950':'#e3b341'}; font-weight:600;">${o.status || 'Pending'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      });
    }
  </script>
</body>
</html>
