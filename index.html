<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - TechCore</title>
  
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; min-height: 100vh; }

   
    .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar h2 { color: #58a6ff; font-size: 1.4rem; font-weight: 700; margin-bottom: 30px; letter-spacing: 0.5px; }
    .nav-links { list-style: none; }
    .nav-links li { margin-bottom: 8px; }
    .nav-links a { color: #8b949e; text-decoration: none; padding: 12px 16px; border-radius: 8px; display: block; font-weight: 500; transition: all 0.2s; }
    .nav-links a:hover, .nav-links a.active { background: #21262d; color: #58a6ff; font-weight: 600; }

    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1px solid #30363d; padding-bottom: 20px; }
    .topbar h2 { color: #fff; font-size: 1.6rem; font-weight: 700; }
    .btn-logout { background: transparent; border: 1px solid #f85149; color: #f85149; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s, color 0.2s; }
    .btn-logout:hover { background: #f85149; color: #fff; }

 
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .stat-card span { color: #8b949e; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card h3 { color: #fff; font-size: 1.8rem; margin-top: 10px; font-weight: 700; }

    
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-header h3 { color: #fff; font-size: 1.25rem; font-weight: 600; }
    .view-all { color: #58a6ff; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .view-all:hover { text-decoration: underline; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { border-bottom: 1px solid #30363d; color: #8b949e; padding: 12px 15px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 14px 15px; border-bottom: 1px solid #21262d; color: #c9d1d9; font-size: 0.92rem; }
    tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>


  <div class="sidebar">
    <div>
      <h2>⚡ TechCore Admin</h2>
      <ul class="nav-links">
        <li><a href="index.html" class="active">📊 Dashboard</a></li>
        <li><a href="products.html">📦 Products</a></li>
        <li><a href="categories.html">📂 Categories</a></li>
        <li><a href="orders.html">🛍️ Orders</a></li>
      </ul>
    </div>
  </div>


  <div class="main-content">
    

    <div class="topbar">
      <div>
        <h2>Dashboard Overview</h2>
        <small style="color: #8b949e;" id="userEmailText">Verifying Session...</small>
      </div>
      <button class="btn-logout" onclick="handleAdminLogout()">Logout</button>
    </div>

  
    <div class="stats-grid">
      <div class="stat-card">
        <span>Total Revenue</span>
        <h3 id="statRevenue">$0.00</h3>
      </div>
      <div class="stat-card">
        <span>Total Orders</span>
        <h3 id="statOrders">0</h3>
      </div>
      <div class="stat-card">
        <span>Pending Orders</span>
        <h3 id="statPending">0</h3>
      </div>
      <div class="stat-card">
        <span>Active Products</span>
        <h3 id="statProducts">0</h3>
      </div>
    </div>

   
    <div class="card">
      <div class="card-header">
        <h3>Recent Orders</h3>
        <a href="orders.html" class="view-all">View All Orders &rarr;</a>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recentOrdersBody">
          <tr>
            <td colspan="5" style="text-align:center; padding: 25px; color: #8b949e;">Loading activity...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
   
    document.addEventListener("DOMContentLoaded", function() {
      verifyAdminSession();
      loadAdminDashboard();
    });
  </script>

</body>
</html>
