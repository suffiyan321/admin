<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Add Product</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #090d11; border-right: 1px solid #30363d; padding: 20px; flex-shrink: 0; }
    .sidebar h2 { color: #fff; margin-bottom: 30px; font-size: 1.2rem; }
    .sidebar a { display: block; color: #c9d1d9; text-decoration: none; padding: 10px 12px; margin-bottom: 6px; border-radius: 6px; }
    .sidebar a.active { background: #2563eb; color: #fff; }
    .content { flex: 1; padding: 30px; }
    .form-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 25px; max-width: 600px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; outline: none; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="index.html">📊 Dashboard</a>
    <a href="products.html">📦 Products</a>
    <a href="add-product.html" class="active">➕ Add Product</a>
    <a href="categories.html">🏷️ Categories</a>
    <a href="orders.html">🛒 Orders</a>
  </div>

  <div class="content">
    <h2 style="color:#fff; margin-bottom:20px;" id="formTitle">Add New Product</h2>
    <div class="form-card">
      <input type="hidden" id="pId">
      <div class="form-group"><label>Product Title</label><input type="text" id="pTitle" placeholder="Title"></div>
      <div class="form-group"><label>Category</label><input type="text" id="pCategory" placeholder="e.g. Electronics"></div>
      <div class="form-group"><label>Price ($)</label><input type="number" id="pPrice" placeholder="0.00"></div>
      <div class="form-group"><label>Stock</label><input type="number" id="pStock" placeholder="10"></div>
      <div class="form-group"><label>Image URL</label><input type="text" id="pImage" placeholder="https://..."></div>
      <div class="form-group"><label>Description</label><textarea id="pDesc" rows="4"></textarea></div>
      <button onclick="saveProduct()" style="background:#2563eb; color:#fff; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">Save Product</button>
    </div>
  </div>

  <script>
    window.onload = function() {
      verifyAdminSession();
      checkEditParam();
    };
  </script>
</body>
</html>
