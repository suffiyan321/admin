<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Categories Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; min-height: 100vh; }

    .sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; padding: 25px 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar h2 { color: #fff; font-size: 1.3rem; font-weight: 700; margin-bottom: 30px; }
    .nav-links { list-style: none; }
    .nav-links li { margin-bottom: 8px; }
    .nav-links a { color: #8b949e; text-decoration: none; padding: 12px 16px; border-radius: 8px; display: block; font-weight: 500; transition: all 0.2s; }
    .nav-links a:hover, .nav-links a.active { background: #1f6beb; color: #fff; font-weight: 600; }

    .btn-logout { background: #21262d; color: #f85149; border: 1px solid #30363d; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; text-align: left; margin-top: auto; }
    .btn-logout:hover { background: #b62324; color: #fff; }

    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .topbar h2 { color: #fff; font-size: 1.6rem; font-weight: 700; }

    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .card h3 { color: #fff; font-size: 1.2rem; margin-bottom: 15px; }

    .form-group { display: flex; gap: 15px; }
    .form-control { flex: 1; background: #0d1117; border: 1px solid #30363d; padding: 10px 15px; border-radius: 8px; color: #fff; outline: none; }
    .form-control:focus { border-color: #58a6ff; }

    .btn-add { background: #238636; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-add:hover { background: #2ea043; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { border-bottom: 1px solid #30363d; color: #8b949e; padding: 12px 15px; font-size: 0.85rem; text-transform: uppercase; }
    td { padding: 14px 15px; border-bottom: 1px solid #21262d; color: #c9d1d9; font-size: 0.9rem; vertical-align: middle; }

    .btn-delete { background: none; border: none; color: #f85149; cursor: pointer; font-weight: 600; }
    .btn-delete:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <h2>Admin Panel</h2>
      <ul class="nav-links">
        <li><a href="index.html">📊 Dashboard</a></li>
        <li><a href="products.html">📦 Products</a></li>
        <li><a href="categories.html" class="active">🏷️ Categories</a></li>
        <li><a href="orders.html">🛒 Orders Tracker</a></li>
      </ul>
    </div>
    <button class="btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
  </div>

  <div class="main-content">
    <div class="topbar">
      <h2>Categories Management</h2>
    </div>

   
    <div class="card">
      <h3>Add New Category</h3>
      <div class="form-group">
        <input type="text" id="categoryName" class="form-control" placeholder="Enter Category Name (e.g., Laptops, Mobiles)...">
        <button class="btn-add" onclick="addCategory()">+ Add Category</button>
      </div>
    </div>

    
    <div class="card">
      <h3>All Categories</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Category Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="categoriesTableBody">
          <tr>
            <td colspan="3" style="text-align:center; padding: 20px; color: #8b949e;">Loading categories...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetchCategories();
    });

   
    function logoutAdmin() {
      localStorage.removeItem('adminLoggedIn');
      localStorage.removeItem('userRole');
      localStorage.removeItem('sb-token');

      const loginURL = 'https://tech-core-shop.netlify.app/login.html';

      if (typeof db !== 'undefined' && db.auth) {
        db.auth.signOut().then(() => {
          window.location.href = loginURL;
        });
      } else {
        window.location.href = loginURL;
      }
    }

   
    function fetchCategories() {
      const tbody = document.getElementById('categoriesTableBody');

      if (typeof db === 'undefined') {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f85149; padding:20px;">Database connection missing!</td></tr>';
        return;
      }

      db.from('categories').select('*').order('id', { ascending: true }).then(res => {
        if (res.error) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#f85149; padding:20px;">Error: ${res.error.message}</td></tr>`;
          return;
        }

        const categories = res.data || [];
        if (categories.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: #8b949e;">No categories added yet.</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        categories.forEach(cat => {
          const name = cat.name || cat.title || cat.category_name || 'Unnamed Category';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>#${cat.id}</b></td>
            <td><b>${name}</b></td>
            <td>
              <button class="btn-delete" onclick="deleteCategory('${cat.id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    
    window.addCategory = function() {
      const input = document.getElementById('categoryName');
      const val = input.value.trim();

      if (!val) {
        alert("Please enter a category name!");
        return;
      }

      db.from('categories').insert([{ name: val }]).then(res => {
        if (res.error) {
          alert("Error adding category: " + res.error.message);
        } else {
          input.value = '';
          fetchCategories();
        }
      });
    };

    
    window.deleteCategory = function(id) {
      if (!confirm("Are you sure you want to delete this category?")) return;

      db.from('categories').delete().eq('id', id).then(res => {
        if (res.error) {
          alert("Delete Error: " + res.error.message);
        } else {
          fetchCategories();
        }
      });
    };
  </script>
</body>
</html>
