<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories Management - Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; padding: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #30363d; padding-bottom: 20px; }
    .header h2 { color: #fff; font-size: 1.6rem; }
    .btn-add { background: #238636; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
    .btn-add:hover { background: #2ea043; }
    .btn-back { background: transparent; border: 1px solid #30363d; color: #8b949e; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; margin-right: 10px; }
    .btn-back:hover { background: #21262d; color: #fff; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
    .card h3 { color: #fff; margin-bottom: 15px; font-size: 1.2rem; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
    .cat-item { background: #21262d; border: 1px solid #30363d; padding: 15px 20px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cat-item-left { display: flex; align-items: center; gap: 12px; }
    .cat-icon { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; background: rgba(255,255,255,0.05); }
    .delete-btn { color: #f85149; cursor: pointer; font-weight: 600; font-size: 0.85rem; border: none; background: transparent; }
    .delete-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2>📂 Category Management</h2>
      <p style="color:#8b949e; font-size:0.9rem; margin-top:5px;">Manage product categories for your store</p>
    </div>
    <div>
      <a href="index.html" class="btn-back">&larr; Back to Dashboard</a>
      <a href="add-category.html" class="btn-add">+ Add New Category</a>
    </div>
  </div>

  <div class="card">
    <h3>Active Store Categories</h3>
    <div id="categoryAdminList" class="grid-container">
      <span style="color:#8b949e;">Loading categories...</span>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      verifyAdminSession();
      drawCategories();
    });
  </script>

</body>
</html>
