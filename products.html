<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Products</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #090d11; border-right: 1px solid #30363d; padding: 20px; flex-shrink: 0; }
    .sidebar h2 { color: #fff; margin-bottom: 30px; font-size: 1.2rem; }
    .sidebar a { display: block; color: #c9d1d9; text-decoration: none; padding: 10px 12px; margin-bottom: 6px; border-radius: 6px; }
    .sidebar a.active { background: #2563eb; color: #fff; }
    .content { flex: 1; padding: 30px; }
    table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-top: 20px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #30363d; font-size: 0.9rem; }
    th { background: #1f242d; color: #fff; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="index.html">📊 Dashboard</a>
    <a href="products.html" class="active">📦 Products</a>
    <a href="add-product.html">➕ Add Product</a>
    <a href="categories.html">🏷️ Categories</a>
    <a href="orders.html">🛒 Orders</a>
  </div>

  <div class="content">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:#fff;">Products List</h2>
      <a href="add-product.html" style="background:#2563eb; color:#fff; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:600;">+ Add New Product</a>
    </div>

    <table>
      <thead>
        <tr><th>Image</th><th>Title</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
      </thead>
      <tbody id="adminTableBody"></tbody>
    </table>
  </div>

  <script>
    window.onload = function() {
      verifyAdminSession();
      loadProductsData();
    };
  </script>
</body>
</html>
